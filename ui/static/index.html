<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auditgym</title>
  <meta name="description" content="Тренажёр для ИИ-аудитора: вымышленные компании с ошибками в учёте и эталонные ответы.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 21l4-10 4 7 3-4 3 7' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 21l4-10 4 7 3-4 3 7"/></svg>
        </div>
        <div>
          <div class="brand-name">auditgym</div>
          <div class="brand-sub">Тренажёр для ИИ-аудитора</div>
        </div>
      </div>

      <button class="btn wide" id="gen-toggle" aria-expanded="false">+ Новая компания</button>
      <form class="gen" id="gen-form" hidden>
        <label class="field">
          <span>Какие ошибки внести</span>
          <select id="gen-preset"></select>
        </label>
        <label class="field">
          <span>Вариант</span>
          <div class="seed-row">
            <input id="gen-seed" type="number" min="0" max="1000000000" value="42">
            <button type="button" class="icon-btn" id="gen-dice" title="Случайный вариант" aria-label="Случайный вариант">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.4"/><circle cx="15.5" cy="15.5" r="1.4"/><circle cx="15.5" cy="8.5" r="1.4"/><circle cx="8.5" cy="15.5" r="1.4"/></svg>
            </button>
          </div>
        </label>
        <button type="submit" class="btn primary wide">Создать</button>
        <p class="hint">Один и тот же вариант всегда даёт одну и ту же компанию.</p>
      </form>

      <nav class="episodes" id="episode-list" aria-label="Компании"></nav>
      <footer class="side-foot" id="side-foot"></footer>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="icon-btn menu" id="menu-btn" aria-label="Список компаний">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="spacer"></span>
        <button class="link-btn" id="help-btn">Как это работает</button>
        <button class="icon-btn" id="theme-btn" title="Тема" aria-label="Переключить тему">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>

      <header class="company" id="company-head"></header>
      <div class="modes" id="modes" role="tablist" aria-label="Режим"></div>
      <p class="mode-hint" id="mode-hint"></p>

      <section id="answers"></section>

      <section class="docs">
        <h2 class="section-h">Документы компании</h2>
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div id="view"></div>
      </section>
    </main>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <div id="drawer-title"></div>
        <button class="icon-btn" id="drawer-close" aria-label="Закрыть">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <div class="modal" id="help" hidden role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="help-title">Как это работает</h2>
          <button class="icon-btn" id="help-close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div id="help-body"></div>
      </div>
    </div>
    <div class="scrim" id="scrim"></div>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
