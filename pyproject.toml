[project]
name = "auditgym"
version = "0.1.0"
description = "Reproducible RL environment for AI financial audit agents (FinTech hackathon 2026)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.setuptools.packages.find]
include = ["auditgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
